<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="0.4.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF8F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)">
<title>Madplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FBF8F2; --surface:#FFFFFF; --surface-2:#F4F0E6;
  --ink:#232019; --muted:#7A7264; --line:#E4DCCE; --line-strong:#CFC4B1;
  --accent:#16495C; --accent-ink:#FFFFFF; --accent-soft:#E2EDF1;
  --ok:#2E6B4F; --ok-soft:#E3EFE7;
  --warn:#8F6408; --warn-soft:#F7EEDA;
  --crit:#A33B27;
  --tile-l:0.62; --tile-c:0.10; --tile-tl:0.30;
  --shadow:0 1px 2px rgba(45,38,26,.06), 0 6px 18px -10px rgba(45,38,26,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17150F; --surface:#211E18; --surface-2:#2A261F;
    --ink:#F1ECE0; --muted:#A09683; --line:#332E26; --line-strong:#4A4237;
    --accent:#7FC0D8; --accent-ink:#10222A; --accent-soft:#1D3540;
    --ok:#7FC79E; --ok-soft:#1C2F26;
    --warn:#DFB25A; --warn-soft:#332A16;
    --crit:#E8907C;
    --tile-l:0.52; --tile-c:0.08; --tile-tl:0.92;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#17150F; --surface:#211E18; --surface-2:#2A261F;
  --ink:#F1ECE0; --muted:#A09683; --line:#332E26; --line-strong:#4A4237;
  --accent:#7FC0D8; --accent-ink:#10222A; --accent-soft:#1D3540;
  --ok:#7FC79E; --ok-soft:#1C2F26;
  --warn:#DFB25A; --warn-soft:#332A16;
  --crit:#E8907C;
  --tile-l:0.52; --tile-c:0.08; --tile-tl:0.92;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Familjen Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  overflow:hidden;
}
.num{font-family:"DM Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{
  flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:12px clamp(14px,2.4vw,28px);min-height:72px;
}
.brand{display:flex;align-items:baseline;gap:11px;margin-right:auto;min-width:0}
.brand h1{font-size:clamp(18px,2.2vw,24px);font-weight:700;letter-spacing:-.01em;margin:0}
.brand .uge{font-size:14px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.brand .uge{display:none}}
.seg{display:flex;gap:4px;background:var(--paper);padding:5px;border-radius:12px;border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted);min-height:44px}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg svg{stroke:currentColor}
@media (max-width:560px){.seg button span{display:none}.seg button{padding:10px 14px}}
.icnbtn{width:46px;height:46px;border-radius:11px;border:1px solid var(--line-strong);display:grid;place-items:center;flex:none}
.icnbtn:hover{border-color:var(--accent);color:var(--accent)}

.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(14px,2.2vw,24px) clamp(14px,2.4vw,28px) 0}
.view.pad0{padding:0}
.bar{
  flex:none;background:var(--surface);border-top:1px solid var(--line-strong);
  display:flex;align-items:center;gap:clamp(14px,2.4vw,32px);
  padding:12px clamp(14px,2.4vw,28px);min-height:88px;flex-wrap:wrap;
}
.kpi .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:clamp(21px,2.6vw,29px);line-height:1.15}
.sep{width:1px;height:44px;background:var(--line)}
@media (max-width:720px){.sep{display:none}}
.grow{margin-left:auto}
.btn{display:flex;align-items:center;gap:10px;border-radius:11px;padding:0 clamp(16px,2vw,24px);height:54px;font-size:16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn svg{stroke:currentColor}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line-strong);font-weight:600}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.fare{background:none;color:var(--crit);border:1px solid var(--crit)}

.hint{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow.acc{color:var(--accent)}
.eyebrow.adv{color:var(--warn)}
.sub{font-size:13px;color:var(--muted)}

/* ---- rettegitter ---- */
.gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:1180px){.gitter{grid-template-columns:repeat(6,minmax(0,1fr))}}
.flise{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .12s}
.flise:hover{border-color:var(--accent)}
.flise[data-on="1"]{border:2px solid var(--accent)}
.flise .top-t{height:clamp(76px,9vw,104px);display:grid;place-items:center}
.flise .bogstav{font-size:clamp(34px,4.4vw,48px);font-weight:700}
.flise .n{font-size:15px;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;overflow-wrap:anywhere}
.flise[data-on="1"] .n{padding-right:36px}
.flise .m{font-size:12px;color:var(--muted);margin-top:3px}
.flise .krop{padding:10px 12px 12px}
.pil{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:13px;font-weight:700;padding:2px 10px}
.info{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.info svg{stroke:#fff}
.dagmaerke{font-size:11px;font-weight:700;color:var(--accent);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

/* ---- forslag ---- */
.forslag{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fkort{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;padding:12px 15px;text-align:left;width:100%}
.fkort .n{font-size:16px;font-weight:600}
.fkort .why{font-size:13px;color:var(--muted);margin-top:3px}
.fkort .why b{color:var(--ok);font-weight:600}
.fkort .pris{text-align:right;flex:none}

/* ---- detalje ---- */
.detalje{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1000px){.detalje{grid-template-columns:290px minmax(0,1fr) minmax(0,1fr)}}
.stortile{height:clamp(150px,20vw,230px);border-radius:16px;display:grid;place-items:center}
.stortile span{font-size:clamp(64px,9vw,104px);font-weight:700}
.kort{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ing{display:flex;align-items:baseline;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.ing .n{flex:1;font-size:18px;font-weight:600}
.trin{display:flex;gap:14px;margin-bottom:16px}
.trin .nr{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;font-size:15px}
.trin .t{font-size:17px;line-height:1.45;padding-top:2px}
.dagvalg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dagvalg button{border:1px solid var(--line-strong);border-radius:10px;min-width:56px;height:46px;font-weight:600;font-size:14px;padding:0 10px}
.dagvalg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---- liste ---- */
.spalter{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,3vw,34px)}
@media (min-width:1000px){.spalter{grid-template-columns:repeat(2,minmax(0,1fr))}}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px 7px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{text-align:right;padding:7px 8px;border-top:1px solid var(--line);font-size:13.5px;white-space:nowrap}
td.v{text-align:left;font-size:14px;font-weight:600;white-space:normal}
td.v small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
td.kat{border-top:0;padding:15px 0 3px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;text-align:left}
.over{color:var(--warn)}
.ingen{color:var(--line-strong)}

/* ---- rester ---- */
.rest{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rest .n{font-weight:600;flex:1;min-width:0}
.mrk{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.m-crit{background:var(--warn-soft);color:var(--crit)}
.m-warn{background:var(--warn-soft);color:var(--warn)}
.m-ok{background:var(--ok-soft);color:var(--ok)}

/* ---- lister/editor ---- */
.raekke{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.raekke:first-child{border-top:0}
.raekke .n{font-weight:600;flex:1;min-width:150px}
.raekke .d{font-size:13px;color:var(--muted)}
.tom{color:var(--muted);font-size:14px;padding:10px 0}
.knaprad{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{font:inherit;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);min-height:44px}
label.f textarea{min-height:120px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;max-width:660px;width:calc(100vw - 28px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,16,10,.6)}
dialog header{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700}
dialog .krop{padding:18px;max-height:70vh;overflow-y:auto}
dialog footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.ingrad{display:grid;grid-template-columns:1fr 92px 46px;gap:8px;align-items:center;margin-bottom:8px}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* ---- tomgang ---- */
#tomgang{position:fixed;inset:0;z-index:60;background:var(--paper);color:var(--ink);display:none;grid-template-columns:minmax(0,1fr);overflow:hidden}
#tomgang.vis{display:grid}
@media (min-width:900px){#tomgang.vis{grid-template-columns:minmax(0,1fr) minmax(0,1.04fr)}}
.tg-v{display:flex;flex-direction:column;padding:clamp(24px,4vw,52px);min-height:0}
.tg-h{background:var(--surface);border-left:1px solid var(--line);padding:clamp(24px,4vw,50px);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
@media (max-width:899px){.tg-h{border-left:0;border-top:1px solid var(--line)}}
.ur{font-size:clamp(64px,13vw,124px);line-height:.92;letter-spacing:-.02em}
.dato{font-size:clamp(17px,2.4vw,24px);color:var(--muted);margin-top:12px}
.iaften{margin-top:auto}
.iaften .kort{display:flex;align-items:center;gap:18px;border-radius:18px;padding:16px 18px;text-align:left;width:100%}
.iaften .tile{flex:none;width:clamp(72px,9vw,96px);height:clamp(72px,9vw,96px);border-radius:16px;display:grid;place-items:center}
.iaften .tile span{font-size:clamp(34px,4.6vw,46px);font-weight:700}
.iaften .n{font-size:clamp(21px,2.9vw,30px);font-weight:700;line-height:1.15}
.tg-dag{display:flex;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.tg-dag:first-of-type{border-top:0;padding-top:0}
.tg-dag .lab{flex:none;width:96px}
.tg-dag .lab b{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tg-dag.idag .lab b{color:var(--accent)}
.tg-dag .lab i{display:block;font-style:normal;font-size:14px;color:var(--muted);opacity:.75}
.tg-dag .r{flex:1;min-width:0;font-size:17px;font-weight:600;padding-top:1px}
.tg-dag .r.fri{font-weight:400;color:var(--line-strong)}
.tgfod{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:10px;color:var(--line-strong);font-size:15px}
.tgfod svg{stroke:currentColor}
</style>
</head>
<body>

<div id="app">
  <div class="top" id="topbar">
    <div class="brand"><h1>Madplan</h1><span class="uge" id="ugetekst"></span></div>
    <div class="seg">
      <button id="fMad" aria-current="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M4 8l2-4h12l2 4"/><path d="M9 13h6"/></svg>
        <span>Mad</span>
      </button>
      <button id="fHjem">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
        <span>Hjem</span>
      </button>
    </div>
    <button class="icnbtn" id="bMere" title="Mere">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
  </div>

  <div class="view" id="view"></div>
  <div class="bar" id="bar" hidden></div>
</div>

<div id="tomgang" aria-hidden="true"></div>

<dialog id="dlgRaa"><form method="dialog">
  <header id="tRaa">Råvare</header>
  <div class="krop"><div class="g2">
    <label class="f">Navn<input id="rNavn" required></label>
    <label class="f">Kategori<input id="rKat" list="kats"></label>
    <label class="f">Enhed<select id="rEnhed"><option value="g">g</option><option value="ml">ml</option><option value="stk">stk</option></select></label>
    <label class="f">Pakkestørrelse<input id="rPakke" type="number" min="1" step="any" required></label>
    <label class="f">Pakkens navn<input id="rPakkenavn" placeholder="fx 500 g bakke"></label>
    <label class="f">Pris pr. pakke (kr)<input id="rPris" type="number" min="0" step="any"></label>
    <label class="f">Holdbar (dage)<input id="rHold" type="number" min="1" step="1"></label>
    <label class="f">Kan fryses<select id="rFrys"><option value="0">Nej</option><option value="1">Ja</option></select></label>
    <label class="f">Haves altid<select id="rAltid"><option value="0">Nej — skal købes</option><option value="1">Ja — står i skabet</option></select></label>
  </div>
  <p class="note">Holdbarheden er hvor mange dage varen er god efter du har købt den. Den styrer hvor hårdt systemet presser på for at få resten brugt.</p></div>
  <footer><button class="btn ghost" value="cancel">Annullér</button><button class="btn" value="ok">Gem</button></footer>
</form></dialog>

<dialog id="dlgRet"><form method="dialog">
  <header id="tRet">Ret</header>
  <div class="krop">
    <div class="g2" style="margin-bottom:16px">
      <label class="f">Navn<input id="dNavn" required></label>
      <label class="f">Antal portioner<input id="dPort" type="number" min="1" step="1" value="4"></label>
    </div>
    <div class="eyebrow" style="margin-bottom:10px">Ingredienser</div>
    <div id="ingList"></div>
    <button type="button" class="btn ghost" id="nyIng" style="margin-top:8px">Tilføj råvare</button>
    <p class="note">Mængderne er for hele retten, ikke pr. portion.</p>
    <label class="f" style="margin-top:14px">Fremgangsmåde — ét trin pr. linje
      <textarea id="dOpskrift" placeholder="Skær kyllingen i tern og løget i både.&#10;Brun kyllingen ved høj varme."></textarea>
    </label>
  </div>
  <footer><button class="btn ghost" value="cancel">Annullér</button><button class="btn" value="ok">Gem</button></footer>
</form></dialog>

<datalist id="kats"></datalist>
<input type="file" id="importFile" accept="application/json" hidden>

<script>

  ["log","Løg Zittauer","g",1000,"1 kg / Danmark",12.00,45,0,"Grønt","2301096",1],

/* ============================================================
   STATE
   ============================================================ */
let S = load();
let visning = "plan", aabenRet = null;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.raavarer) && Array.isArray(d.retter)) return migrer(d);
    }
  }catch(e){ /* korrupt data — start forfra frem for at gå i stå */ }
  return {v:VERSION, dataVersion:DATA_VERSION, raavarer:SEED_RAAVARER, retter:SEED_RETTER,
          seedSet:SEED_RETTER.map(x => x.id), valgt:{}, uge:{}, haUrl:"", tomgangMin:3, tema:"auto"};
}

/* Opdaterer gemte data uden at røre det du selv har lavet. */
function migrer(d){
  d.uge = d.uge || {};
  d.haUrl = d.haUrl || "";
  d.tema = d.tema || "auto";
  if(d.tomgangMin == null) d.tomgangMin = 3;
  if(d.dataVersion == null) d.dataVersion = DATA_VERSION;
  if(d.v === VERSION) return d;
  const nye = Object.fromEntries(SEED_RAAVARER.map(r => [r.id, r]));
  d.raavarer = d.raavarer.map(r => nye[r.id] ? Object.assign({}, r, nye[r.id]) : r);
  const haves = new Set(d.raavarer.map(r => r.id));
  SEED_RAAVARER.forEach(r => { if(!haves.has(r.id)) d.raavarer.push(r); });
  // retter der er taget ud af kataloget — fjernes også på enheder der har dem
  const vaek = new Set(FJERNEDE);
  d.retter = d.retter.filter(x => !vaek.has(x.id));
  vaek.forEach(id => { delete d.valgt[id];
    Object.keys(d.uge).forEach(dag => { if(d.uge[dag] === id) delete d.uge[dag]; }); });
  const ret2 = {karry:{karrypasta:50}, chili:{kidneybonner:500}, wok:{squash:1},
               koedboller:{champignon:500, svampemix:200}};
  const opsk = Object.fromEntries(SEED_RETTER.filter(x => x.opskrift).map(x => [x.id, x.opskrift]));
  d.retter.forEach(x => {
    if(ret2[x.id]) Object.assign(x.ing, ret2[x.id]);
    if(!x.opskrift && opsk[x.id]) x.opskrift = opsk[x.id];
  });
  // nye seed-retter lægges ind én gang; slettede kommer ikke igen
  const set = new Set(d.seedSet || RETTER_V4);
  SEED_RETTER.forEach(x => {
    if(set.has(x.id)) return;
    if(!d.retter.some(r => r.id === x.id)) d.retter.push(x);
    set.add(x.id);
  });
  d.seedSet = [...set];
  d.v = VERSION;
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* Tema pr. enhed: køkkentabletten kan stå mørk, mens laptoppen følger systemet */
function temaPaa(){

  else document.documentElement.dataset.theme = (t === "moerk" ? "dark" : "light");
}

/* Henter fælles data fra data/*.json når appen ligger på en server.
   Råvarer overskrives; retter tilføjes kun. */
async function hentFaelles(){
  if(location.protocol === "file:") return;   // lokal fil — kør på det indbyggede uden at støje
  let aendret = false;
  const hent = p => fetch(p, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
  try{
    const [raa, ret] = await Promise.all([hent("data/raavarer.json"), hent("data/retter.json")]);
    const nu = S.dataVersion || 0;
    if(raa && Array.isArray(raa.raavarer) && (raa.version || 0) > nu){
      const nye = Object.fromEntries(raa.raavarer.map(r => [r.id, r]));
      S.raavarer = S.raavarer.map(r => nye[r.id] ? Object.assign({}, r, nye[r.id]) : r);
      const haves = new Set(S.raavarer.map(r => r.id));
      raa.raavarer.forEach(r => { if(!haves.has(r.id)) S.raavarer.push(r); });
      aendret = true;
    }
    if(ret && Array.isArray(ret.retter) && (ret.version || 0) > nu){
      const haves = new Set(S.retter.map(d => d.id));
      ret.retter.forEach(d => { if(!haves.has(d.id)){ S.retter.push(d); aendret = true; } });
    }
    const ny = Math.max((raa && raa.version) || 0, (ret && ret.version) || 0);
    if(ny > nu){ S.dataVersion = ny; aendret = true; }
  }catch(e){}
  if(aendret) tegn();
}

const raa = id => S.raavarer.find(r => r.id === id);
const ret = id => S.retter.find(r => r.id === id);

/* ============================================================
   BEREGNING
   ============================================================ */
const enhedspris = r => (r.pris || 0) / (r.pakke || 1);

function hast(r){
  const h = r.holdbar || 365;
  let f = h <= 4 ? 2.0 : h <= 8 ? 1.5 : h <= 21 ? 1.0 : 0.15;
  if(r.frys) f *= 0.5;
  return f;
}
function behov(valgt){
  const b = {};
  for(const [rid, antal] of Object.entries(valgt)){
    const d = ret(rid); if(!d || !antal) continue;
    for(const [vid, m] of Object.entries(d.ing)) b[vid] = (b[vid] || 0) + m * antal;
  }
  return b;
}
function indkoeb(b){
  const rows = [];
  for(const [vid, kraevet] of Object.entries(b)){
    const r = raa(vid);
    if(!r || r.altid) continue;   // krydderier og basisvarer købes ikke pr. ret
    const pakker = Math.ceil(kraevet / r.pakke - 1e-9);
    const koebt = pakker * r.pakke;
    rows.push({r, kraevet, pakker, koebt, over: koebt - kraevet, pris: pakker * (r.pris || 0)});
  }
  rows.sort((a,b2) => a.r.kategori === b2.r.kategori
    ? a.r.navn.localeCompare(b2.r.navn,"da") : a.r.kategori.localeCompare(b2.r.kategori,"da"));
  return rows;
}
function forslag(over, valgt){
  const out = [];
  for(const d of S.retter){
    if(valgt[d.id]) continue;
    let reddet = 0, nyt = 0; const brugte = [];
    for(const [vid, m] of Object.entries(d.ing)){
      const r = raa(vid); if(!r) continue;
      const brugt = Math.min(m, over[vid] || 0);
      if(brugt > 0){ reddet += brugt * enhedspris(r) * hast(r); brugte.push({navn:r.navn, m:brugt, enhed:r.enhed}); }
      const mangler = m - brugt;
      if(mangler > 1e-9) nyt += Math.ceil(mangler / r.pakke - 1e-9) * (r.pris || 0);
    }
    if(reddet <= 0) continue;
    brugte.sort((a,b2) => b2.m - a.m);
    out.push({d, reddet, nyt, brugte, score: reddet - 0.25 * nyt});
  }
  out.sort((a,b2) => b2.score - a.score);
  return out.slice(0,3);
}
function rester(rows){
  const o = {}; rows.forEach(x => { if(x.over > 1e-9) o[x.r.id] = x.over; }); return o;
}
function risiko(rows){
  return rows.filter(x => x.over > 1e-9).reduce((s,x) =>
    s + x.over * enhedspris(x.r) * ((x.r.frys || (x.r.holdbar||365) > 21) ? 0.1 : 1), 0);
}

/* ============================================================
   FORMATERING OG DATO
   ============================================================ */
const kr = n => Math.round(n).toLocaleString("da-DK") + " kr";
const kr2 = n => n.toLocaleString("da-DK",{minimumFractionDigits:2,maximumFractionDigits:2}) + " kr";
function maengde(n, enhed){
  if(enhed === "stk") return (Math.round(n*10)/10).toLocaleString("da-DK") + " stk";
  if(n >= 1000) return (Math.round(n/10)/100).toLocaleString("da-DK") + (enhed === "ml" ? " l" : " kg");
  return Math.round(n).toLocaleString("da-DK") + " " + enhed;
}
const DAGE = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const DAGK = ["man","tir","ons","tor","fre","lør","søn"];
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
function ugensDage(){
  const nu = new Date();
  const man = new Date(nu);
  man.setDate(nu.getDate() - ((nu.getDay() + 6) % 7));
  return Array.from({length:7}, (_,i) => { const x = new Date(man); x.setDate(man.getDate()+i); return x; });
}
function ugeNr(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil((((t - new Date(Date.UTC(t.getUTCFullYear(),0,1))) / 86400000) + 1) / 7);
}
/* Fast farve pr. ret — samme lyshed og mætning hele vejen rundt, kun kulør varierer */
function kulor(id){
  let h = 0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) % 360;
  return h;
}
const tileBg = id => `oklch(var(--tile-l) var(--tile-c) ${kulor(id)})`;
const tileFg = id => `oklch(var(--tile-tl) 0.06 ${kulor(id)})`;
const bogstav = n => (n.trim()[0] || "?").toUpperCase();

/* ============================================================

   ============================================================ */
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const V = document.getElementById("view");
const BAR = document.getElementById("bar");

function vis(n, arg){
  visning = n;
  if(n === "ret") aabenRet = arg;
  document.getElementById("tomgang").classList.toggle("vis", n === "tomgang");
  document.getElementById("tomgang").setAttribute("aria-hidden", String(n !== "tomgang"));
  document.getElementById("app").hidden = (n === "tomgang");
  if(n !== "tomgang") tegn();
  else tegnTomgang();
  V.scrollTop = 0;
}

function tegn(){
  if(visning === "tomgang") return tegnTomgang();
  document.getElementById("ugetekst").textContent =
    "Uge " + ugeNr(new Date()) + " · " + ugensDage()[0].getDate() + ".–" +
    ugensDage()[6].toLocaleDateString("da-DK",{day:"numeric",month:"long"});
  document.getElementById("fMad").setAttribute("aria-current", String(visning !== "hjem"));
  document.getElementById("fHjem").setAttribute("aria-current", String(visning === "hjem"));
  V.innerHTML = ""; BAR.innerHTML = ""; BAR.hidden = true; V.className = "view";
  ({plan:sPlan, ret:sRet, liste:sListe, mere:sMere, retter:sRetter, raavarer:sRaavarer, hjem:sHjem}[visning] || sPlan)();
  save();
}

/* ---------- Ugens plan ---------- */
function sPlan(){
  const rows = indkoeb(behov(S.valgt)), over = rester(rows);
  const sum = rows.reduce((s,x) => s + x.pris, 0);

  const h = el("div","hint");
  h.append(el("span","eyebrow","Tryk for at vælge"),
           el("span","sub","Tryk prikken for opskrift og ingredienser"));
  h.lastChild.style.marginLeft = "auto";
  V.append(h);

  const g = el("div","gitter");
  const dagFor = {};
  Object.entries(S.uge).forEach(([d,r]) => { dagFor[r] = d; });
  [...S.retter].sort((a,b) => a.navn.localeCompare(b.navn,"da")).forEach(d => {
    const n = S.valgt[d.id] || 0;
    const b = el("button","flise"); b.dataset.on = n ? "1" : "0";
    const t = el("div","top-t"); t.style.background = tileBg(d.id);
    const bg = el("span","bogstav", bogstav(d.navn)); bg.style.color = tileFg(d.id);
    t.append(bg); b.append(t);
    if(n){ const p = el("span","pil", n + "×"); b.append(p); }
    const i = el("span","info");
    i.innerHTML = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.5"/></svg>';
    i.onclick = e => { e.stopPropagation(); vis("ret", d.id); };
    b.append(i);
    const k = el("div","krop");
    k.append(el("div","n", d.navn), el("div","m", d.portioner + " portioner"));
    if(dagFor[d.id]){
      const dt = new Date(dagFor[d.id] + "T12:00:00");
      k.append(el("div","dagmaerke", DAGE[(dt.getDay()+6)%7]));
    }
    b.append(k);
    b.onclick = () => { S.valgt[d.id] = (S.valgt[d.id]||0) + 1; tegn(); };
    b.oncontextmenu = e => { e.preventDefault(); fjern(d.id); };
    g.append(b);
  });
  V.append(g);

  const f = forslag(over, S.valgt);
  if(f.length){
    const hh = el("div","hint"); hh.style.marginTop = "26px";
    hh.append(el("span","eyebrow adv","Brug resterne"),
              el("span","sub","Retter der spiser sig ind i det du alligevel køber"));
    V.append(hh);
    const fg = el("div","forslag");
    f.forEach(s => {
      const c = el("button","fkort");
      const v = el("div"); v.style.flex = "1"; v.style.minWidth = "0";
      v.append(el("div","n", s.d.navn));
      const w = el("div","why");
      w.append(document.createTextNode("Bruger "));
      const b = el("b", null, s.brugte.slice(0,3).map(x => maengde(x.m,x.enhed) + " " + x.navn.toLowerCase()).join(", "));
      w.append(b, document.createTextNode(" af dine rester"));
      v.append(w);
      const p = el("div","pris");
      p.append(el("div","num", kr(s.nyt)), el("div","sub","nyt"));
      c.append(v, p);
      c.onclick = () => { S.valgt[s.d.id] = (S.valgt[s.d.id]||0)+1; tegn(); };
      fg.append(c);
    });
    V.append(fg);
  }
  V.append(Object.assign(el("div"),{style:"height:24px"}));

  const antal = Object.values(S.valgt).reduce((a,b) => a+b, 0);
  const port = Object.entries(S.valgt).reduce((a,[id,n]) => a + n * (ret(id)?.portioner || 0), 0);
  bar([["Indkøb i alt", kr(sum), null],
       ["I risiko for at ryge ud", kr(risiko(rows)), "var(--warn)"],
       ["Valgt", antal ? antal + " retter · " + port + " portioner" : "Ingen endnu", null, true]],
      [["Ryd ugen","ghost",() => { S.valgt = {}; S.uge = {}; tegn(); }],
       ["Se indkøbslisten","",() => vis("liste"), 'M3 5h2l2.4 10.4a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.55L20.5 8H6']]);
}
function fjern(id){
  if(!S.valgt[id]) return;
  S.valgt[id]--;
  if(!S.valgt[id]){ delete S.valgt[id]; Object.keys(S.uge).forEach(d => { if(S.uge[d] === id) delete S.uge[d]; }); }
  tegn();
}

/* ---------- Indkøbslisten ---------- */
function sListe(){
  const rows = indkoeb(behov(S.valgt));
  const tilbage = el("button","btn ghost");
  tilbage.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Ugens plan';
  tilbage.onclick = () => vis("plan");
  const hd = el("div","hint"); hd.style.marginBottom = "16px";
  const nv = el("span",null,"Indkøbsliste"); nv.style.fontSize = "20px"; nv.style.fontWeight = "700";
  hd.append(tilbage, nv, el("span","sub", rows.length ? rows.length + " varer" : "Ingen varer endnu"));
  V.append(hd);

  if(!rows.length){
    V.append(el("p","tom","Vælg nogle retter, så laver jeg listen."));
    return;
  }

  const halv = Math.ceil(rows.length / 2);
  const sp = el("div","spalter");
  [rows.slice(0,halv), rows.slice(halv)].forEach(del => {
    if(!del.length) return;
    const tb = el("table");
    tb.innerHTML = "<thead><tr><th>Vare</th><th>Behov</th><th>Køb</th><th>Til overs</th><th>Pris</th></tr></thead>";
    const body = el("tbody"); let kat = null;
    del.forEach(x => {
      if(x.r.kategori !== kat){
        kat = x.r.kategori;
        const tr = el("tr"); const td = el("td","kat",kat); td.colSpan = 5; tr.append(td); body.append(tr);
      }
      const tr = el("tr");
      const v = el("td","v"); v.append(el("span",null,x.r.navn),
        el("small",null, x.pakker + " × " + (x.r.pakkenavn || maengde(x.r.pakke, x.r.enhed))));
      const c = [el("td","num", maengde(x.kraevet, x.r.enhed)),
                 el("td","num", maengde(x.koebt, x.r.enhed)),
                 el("td","num " + (x.over > 1e-9 ? "over" : "ingen"), x.over > 1e-9 ? maengde(x.over, x.r.enhed) : "–"),
                 el("td","num", x.pris.toLocaleString("da-DK",{minimumFractionDigits:2,maximumFractionDigits:2}))];
      tr.append(v, ...c); body.append(tr);
    });
    tb.append(body); sp.append(tb);
  });
  V.append(sp);

  const rest = rows.filter(x => x.over > 1e-9).sort((a,b) => (a.r.holdbar||365)-(b.r.holdbar||365));
  if(rest.length){
    const hh = el("div","hint"); hh.style.marginTop = "26px";
    hh.append(el("span","eyebrow adv","Det bliver til overs"));
    V.append(hh);
    const box = el("div");
    rest.slice(0,8).forEach(x => {
      const r = x.r, h = r.holdbar || 365;
      const cls = r.frys ? "m-ok" : h <= 4 ? "m-crit" : h <= 21 ? "m-warn" : "m-ok";
      const txt = r.frys ? "kan fryses" : h > 21 ? "holder længe" : "brug inden " + h + " dage";
      const row = el("div","rest");
      row.append(el("span","n", r.navn), el("span","num", maengde(x.over, r.enhed)), el("span","mrk " + cls, txt));
      box.append(row);
    });
    V.append(box);
  }
  V.append(Object.assign(el("div"),{style:"height:24px"}));

  const sum = rows.reduce((s,x) => s + x.pris, 0);
  const port = Object.entries(S.valgt).reduce((a,[id,n]) => a + n * (ret(id)?.portioner || 0), 0);
  bar([["I alt", kr2(sum), null],
       ["Pris pr. portion", port ? kr2(sum/port) : "–", "var(--ok)"]],
      [["Kopiér liste","ghost", kopier, 'M9 9h11v11H9zM5 15V5a1 1 0 0 1 1-1h9']]);
}
async function kopier(e){
  const rows = indkoeb(behov(S.valgt));
  const txt = rows.map(x => x.pakker + " × " + (x.r.pakkenavn || maengde(x.r.pakke, x.r.enhed)) + " " + x.r.navn).join("\n");
  const b = e.currentTarget;
  try{ await navigator.clipboard.writeText(txt); b.lastChild.textContent = "Kopieret"; }
  catch(err){ b.lastChild.textContent = "Kunne ikke kopiere"; }
  setTimeout(() => b.lastChild.textContent = "Kopiér liste", 1800);
}

  nulstilIdle();
}, {passive:true}));

const dlgRaa = document.getElementById("dlgRaa");
let raaEdit = null;
function editRaa(r){
  raaEdit = r;
  tRaa.textContent = r ? r.navn : "Ny råvare";
  rNavn.value = r ? r.navn : ""; rKat.value = r ? r.kategori : "Kolonial";
  rEnhed.value = r ? r.enhed : "g"; rPakke.value = r ? r.pakke : "";
  rPakkenavn.value = r ? (r.pakkenavn||"") : ""; rPris.value = r ? r.pris : "";
  rHold.value = r ? r.holdbar : 7; rFrys.value = r && r.frys ? "1" : "0";
  rAltid.value = r && r.altid ? "1" : "0";
  dlgRaa.showModal();
}
dlgRaa.addEventListener("close", () => {
  if(dlgRaa.returnValue !== "ok" || !rNavn.value.trim() || !(+rPakke.value > 0)) return;
  const o = {id: raaEdit ? raaEdit.id : "r" + Date.now().toString(36),
    navn: rNavn.value.trim(), kategori: rKat.value.trim() || "Andet", enhed: rEnhed.value,
    pakke: +rPakke.value, pakkenavn: rPakkenavn.value.trim(), pris: +rPris.value || 0,
    holdbar: +rHold.value || 7, frys: rFrys.value === "1", altid: rAltid.value === "1"};
  if(raaEdit) Object.assign(raaEdit, o); else S.raavarer.push(o);
  tegn();
});

const dlgRet = document.getElementById("dlgRet");
let retEdit = null;
function ingRow(vid, m){
  const row = el("div","ingrad");
  const sel = el("select");
  [...S.raavarer].sort((a,b) => a.navn.localeCompare(b.navn,"da")).forEach(r => {
    const o = el("option",null, r.navn + " (" + r.enhed + ")"); o.value = r.id; sel.append(o);
  });
  if(vid) sel.value = vid;
  const inp = el("input"); inp.type = "number"; inp.min = "0"; inp.step = "any"; inp.value = m || "";
  const del = el("button","btn ghost","×"); del.type = "button"; del.style.padding = "0 14px";
  del.onclick = () => row.remove();
  row.append(sel, inp, del);
  return row;
}
function editRet(d){
  retEdit = d;
  tRet.textContent = d ? d.navn : "Ny ret";
  dNavn.value = d ? d.navn : ""; dPort.value = d ? d.portioner : 4;
  dOpskrift.value = d && d.opskrift ? d.opskrift.join("\n") : "";
  ingList.innerHTML = "";
  if(d) Object.entries(d.ing).forEach(([vid,m]) => ingList.append(ingRow(vid,m)));
  else ingList.append(ingRow(null,null));
  dlgRet.showModal();
}
document.getElementById("nyIng").onclick = () => ingList.append(ingRow(null,null));
dlgRet.addEventListener("close", () => {
  if(dlgRet.returnValue !== "ok" || !dNavn.value.trim()) return;
  const ing = {};
  ingList.querySelectorAll(".ingrad").forEach(row => {
    const vid = row.querySelector("select").value, m = +row.querySelector("input").value;
    if(vid && m > 0) ing[vid] = (ing[vid] || 0) + m;
  });
  const trin = dOpskrift.value.split("\n").map(s => s.trim()).filter(Boolean);
  const o = {id: retEdit ? retEdit.id : "d" + Date.now().toString(36),
    navn: dNavn.value.trim(), portioner: +dPort.value || 4, ing, opskrift: trin.length ? trin : null};
  if(retEdit) Object.assign(retEdit, o); else S.retter.push(o);
  tegn();
});

   DATA IND OG UD
   ============================================================ */
function eksport(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = "madplan-data.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("importFile").onchange = function(){
  const f = this.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!Array.isArray(d.raavarer) || !Array.isArray(d.retter)) throw new Error("Filen indeholder ikke råvarer og retter");
      S = migrer(d); S.valgt = S.valgt || {}; tegn();
    }catch(err){ alert("Kunne ikke læse filen: " + err.message); }
    this.value = "";
  };
  fr.readAsText(f);
};
